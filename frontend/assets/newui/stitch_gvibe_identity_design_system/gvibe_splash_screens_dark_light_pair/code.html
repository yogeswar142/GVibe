<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GVibe Splash Screens - Dark & Light Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #060908;
      color: #E8F4F2;
      -webkit-font-smoothing: antialiased;
    }

    .font-brand {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Dark Theme Gradient for G */
    .g-gradient-dark {
      background: linear-gradient(90deg, #0D9488 0%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Light Theme Gradient for G */
    .g-gradient-light {
      background: linear-gradient(90deg, #0F766E 0%, #B45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Dark Theme Hairline */
    .hairline-dark {
      width: 52px;
      height: 1px;
      background: linear-gradient(90deg, #0D9488 0%, #D97706 100%);
      opacity: 0.65;
    }

    /* Light Theme Hairline */
    .hairline-light {
      width: 52px;
      height: 1px;
      background: linear-gradient(90deg, #0F766E 0%, #B45309 100%);
      opacity: 0.50;
    }

    /* Phone Mockup Canvas */
    .phone-canvas {
      width: 360px;
      height: 800px;
      position: relative;
      overflow: hidden;
      border-radius: 40px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    /* Dark Ambient Radial Glow */
    .dark-ambient-glow {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 100px;
      background: radial-gradient(ellipse at center, rgba(13, 148, 136, 0.12) 0%, rgba(13, 148, 136, 0) 70%);
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 md:p-12">

  <!-- Header Context Badge -->
  <header class="mb-8 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#131C1A] border border-[rgba(13,148,136,0.25)] mb-3">
      <span class="w-2 h-2 rounded-full bg-[#D97706]"></span>
      <span class="text-xs tracking-wider text-[#7A9E9A] uppercase font-medium">GVibe Identity System V3</span>
    </div>
    <h1 class="text-xl md:text-2xl font-brand font-bold text-[#E8F4F2] tracking-tight">Bay & Gold Coastal · Splash Pair</h1>
    <p class="text-xs md:text-sm text-[#7A9E9A] mt-1">Dual viewport presentation · 360 × 800dp side-by-side</p>
  </header>

  <!-- Side-by-Side Presentation Showcase -->
  <main class="flex flex-wrap items-center justify-center gap-10 md:gap-14 max-w-6xl w-full">

    <!-- ==================== DARK THEME PHONE ==================== -->
    <div class="flex flex-col items-center">
      <div class="phone-canvas bg-[#080C0B]">
        <!-- Layer 1: Ambient glow behind wordmark (at 45% from top) -->
        <div class="dark-ambient-glow" aria-hidden="true"></div>

        <!-- Wordmark + Tagline + Hairline cluster centered at 45% top -->
        <div class="absolute left-0 right-0 flex flex-col items-center" style="top: 45%; transform: translateY(-50%);">
          <!-- Layer 2: Wordmark -->
          <div class="font-brand font-bold text-[44px] leading-none tracking-[-0.5px] flex items-center justify-center select-none">
            <span class="g-gradient-dark">G</span><span class="text-[#E8F4F2]">Vibe</span>
          </div>

          <!-- Layer 3: Tagline (10px below wordmark baseline) -->
          <p class="font-normal text-[13px] leading-normal text-[#7A9E9A] text-center select-none mt-[10px]">
            your campus, your people
          </p>

          <!-- Layer 4: Hairline (16px below tagline) -->
          <div class="hairline-dark mt-[16px]"></div>
        </div>

        <!-- Layer 5: Footer (32px above bottom edge) -->
        <footer class="absolute bottom-[32px] left-0 right-0 text-center select-none px-4">
          <p class="font-normal text-[11px] leading-normal text-[#3D5C58]">
            GITAM University · Visakhapatnam
          </p>
        </footer>
      </div>

      <!-- Theme Label below device -->
      <div class="mt-4 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#0D9488]"></span>
        <span class="text-xs font-medium tracking-wide text-[#7A9E9A]">Dark Theme · #080C0B</span>
      </div>
    </div>

    <!-- ==================== LIGHT THEME PHONE ==================== -->
    <div class="flex flex-col items-center">
      <div class="phone-canvas bg-[#F5FAF9]">

        <!-- Cluster positioned identically at 45% from top -->
        <div class="absolute left-0 right-0 flex flex-col items-center" style="top: 45%; transform: translateY(-50%);">
          
          <!-- Wordmark wrapper with Layer 1 Decorative Ring aligned to G -->
          <div class="relative flex items-center justify-center">
            
            <!-- Layer 1: Decorative ring (80px diameter, 1.5px stroke, #0F766E at 25% opacity) -->
            <!-- Aligned precisely with the center of the "G" glyph -->
            <div 
              class="absolute pointer-events-none rounded-full"
              style="
                width: 80px; 
                height: 80px; 
                border: 1.5px solid rgba(15, 118, 110, 0.25); 
                top: 50%;
                left: 0;
                transform: translate(-14px, -50%);
              "
              aria-hidden="true"
            ></div>

            <!-- Layer 2: Wordmark -->
            <div class="font-brand font-bold text-[44px] leading-none tracking-[-0.5px] flex items-center justify-center select-none relative z-10">
              <span class="g-gradient-light">G</span><span class="text-[#0C1F1D]">Vibe</span>
            </div>
          </div>

          <!-- Layer 3: Tagline (10px below wordmark) -->
          <p class="font-normal text-[13px] leading-normal text-[#3D6B66] text-center select-none mt-[10px]">
            your campus, your people
          </p>

          <!-- Layer 4: Hairline (16px below tagline) -->
          <div class="hairline-light mt-[16px]"></div>
        </div>

        <!-- Layer 5: Footer (32px above bottom edge) -->
        <footer class="absolute bottom-[32px] left-0 right-0 text-center select-none px-4">
          <p class="font-normal text-[11px] leading-normal text-[#6B9E99]">
            GITAM University · Visakhapatnam
          </p>
        </footer>
      </div>

      <!-- Theme Label below device -->
      <div class="mt-4 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#B45309]"></span>
        <span class="text-xs font-medium tracking-wide text-[#7A9E9A]">Light Theme · #F5FAF9</span>
      </div>
    </div>

  </main>

</body>
</html>
